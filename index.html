<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grito-Dex Pro | v9.2 Full Layout</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body id="app-body" class="theme-1">
    <div class="pokedex-case">
        <div class="top-header">
            <div class="blue-eye" id="status-light"></div>
            <div class="light-dots">
                <div class="dot red"></div>
                <div class="dot yellow"></div>
                <div class="dot green"></div>
            </div>
        </div>

        <h1 class="main-title">GRITO-DEX</h1>
        
        <div class="nav-tabs">
            <button id="btn-game" class="active">JUGAR</button>
            <button id="btn-view-gritodex">DEX</button>
        </div>

        <!-- VISTA JUGAR (Controles verticales de ancho completo) -->
        <div id="game-view">
            <div class="controls-top">
                <select id="gen-select" class="retro-select">
                    <option value="1">GEN 1 (KANTO)</option>
                    <option value="2">GEN 2 (JOHTO)</option>
                    <option value="3">GEN 3 (HOENN)</option>
                    <option value="4">GEN 4 (SINNOH)</option>
                    <option value="5">GEN 5 (UNOVA)</option>
                    <option value="6">GEN 6 (KALOS)</option>
                    <option value="7">GEN 7 (ALOLA)</option>
                    <option value="8">GEN 8 (GALAR)</option>
                    <option value="9">GEN 9 (PALDEA)</option>
                    <option value="all">TODAS (1-9)</option>
                </select>
                <button id="play-btn">REPRODUCIR GRITO</button>
            </div>

            <div class="pokedex-screen">
                <div id="main-screen">
                    <div id="options-container" class="options-list"></div>
                </div>
            </div>

            <div id="feedback" class="hidden">
                <p id="message"></p>
                <button id="next-btn">CONTINUAR</button>
            </div>
        </div>

        <!-- VISTA DEX (2 COLUMNAS + SCROLL) -->
        <div id="gritodex-view" class="hidden">
            <div class="pokedex-screen">
                <div id="gritodex-screen">
                    <h3 class="dex-counter">VISTOS: <span id="count">0</span></h3>
                    <div id="gritodex-list"></div>
                </div>
            </div>
        </div>

        <div class="pokedex-footer">
            <div class="vent-lines">
                <span></span><span></span><span></span>
            </div>
            <div class="d-pad"></div>
        </div>
    </div>

    <audio id="snd-success" src="https://assets.mixkit.co/active_storage/sfx/2000/2000-preview.mp3"></audio>
    <audio id="snd-error" src="https://assets.mixkit.co/active_storage/sfx/2003/2003-preview.mp3"></audio>

    <script src="script.js"></script>
</body>
</html>
